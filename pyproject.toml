[project]
name = "xerodemo"
version = "0.1.0"
description = "Python scaffold for Interview XeroDemo."
authors = [
  {name = "Interview Candidate", email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "click>=8.1",
  "requests>=2.28",
  "python-dotenv>=0.19",
  "flask>=2.3",
  "flask-sqlalchemy>=3.0",
  "pyjwt>=2.6",
  "werkzeug>=2.3"
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-console-scripts>=1.2",
  "ruff>=0.0.281",
  "black>=24.0"
]

[project.scripts]
xerodemo = "xerodemo.cli:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
