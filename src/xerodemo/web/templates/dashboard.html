{% extends "base.html" %} {% block title %}Dashboard - XeroDemo{% endblock %} {%
block content %}
<h2>Dashboard</h2>

<div
  style="background: white; padding: 20px; border-radius: 4px; margin: 20px 0"
>
  <h3>Welcome, {{ user.first_name or user.email }}!</h3>
  <p style="color: #666; margin-top: 10px">Email: {{ user.email }}</p>
  {% if user.xero_id %}
  <p style="color: #666">&#10003; Connected to Xero</p>
  {% endif %}
  <div style="margin-top: 15px">
    <a href="{{ url_for('app.logout') }}" class="btn secondary">Logout</a>
  </div>
</div>

{% endblock %}
