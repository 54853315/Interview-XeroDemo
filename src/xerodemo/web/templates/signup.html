{% extends "base.html" %} {% block title %}Sign Up - XeroDemo{% endblock %} {%
block content %}
<div style="max-width: 400px; margin: 60px auto">
  <h2 style="margin-bottom: 30px">Create Account</h2>

  <form method="post">
    <label for="email">Email:</label>
    <input
      type="email"
      id="email"
      name="email"
      value="{{ prefill.get('email', '') }}"
      required
    />

    <label for="first_name">First Name:</label>
    <input
      type="text"
      id="first_name"
      name="first_name"
      value="{{ prefill.get('first_name', '') }}"
    />

    <label for="last_name">Last Name:</label>
    <input
      type="text"
      id="last_name"
      name="last_name"
      value="{{ prefill.get('last_name', '') }}"
    />

    <label for="password">Password:</label>
    <input type="password" id="password" name="password" required />

    <button type="submit" class="btn" style="width: 100%; margin-bottom: 20px">
      Create Account
    </button>
  </form>

  <div style="text-align: center; margin-top: 20px">
    <p>
      Already have an account? <a href="{{ url_for('app.login') }}">Login</a>
    </p>
  </div>
</div>
{% endblock %}
